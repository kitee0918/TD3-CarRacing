[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td3-carracing-course"
version = "0.1.0"
description = "A curated TD3 CarRacing-v3 course project with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "gymnasium",
  "Box2D>=2.3.10,<2.4",
  "pygame-ce>=2.1.3",
  "opencv-python",
  "numpy",
  "torch",
  "tensorboard",
]

[project.optional-dependencies]
legacy = ["torchvision", "matplotlib", "pandas"]

[project.scripts]
td3-carracing-train = "td3_carracing.train:main"
td3-carracing-eval = "td3_carracing.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]
